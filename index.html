<!DOCTYPE html>
<html>
<head>
    <title>Saiyan Stance: Namek Saga</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; text-align: center; }
        #game-container { position: relative; width: 100vw; height: 100vh; transition: background 2s; }
        
        /* UI Elements */
        #hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; font-size: 1.5rem; text-shadow: 2px 2px black; }
        #story-box { position: absolute; bottom: 50px; width: 80%; left: 10%; background: rgba(0,0,0,0.8); border: 2px solid #0cf; padding: 15px; border-radius: 10px; font-style: italic; }
        
        /* Frieza Boss Bar */
        #boss-ui { display: none; position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: 300px; }
        #hp-bg { width: 100%; height: 20px; background: #333; border: 2px solid white; }
        #hp-fill { width: 100%; height: 100%; background: #a0f; transition: width 0.2s; }

        /* Combat Button */
        #click-zone { width: 200px; height: 200px; background: radial-gradient(circle, #fff 0%, #0cf 70%); border-radius: 50%; margin: 150px auto; cursor: pointer; box-shadow: 0 0 20px #0cf; transition: transform 0.1s; }
        #click-zone:active { transform: scale(0.9); }
        .mui-glow { box-shadow: 0 0 50px #fff, 0 0 100px #0cf !important; }
    </style>
</head>
<body id="bg">

    <div id="game-container">
        <div id="hud">
            <div>LEVEL: <span id="lvl-txt">1 (Earth)</span></div>
            <div>KI POWER: <span id="power-txt">0</span></div>
        </div>

        <div id="boss-ui">
            <div style="color: #a0f; font-weight: bold; margin-bottom: 5px;">LORD FRIEZA</div>
            <div id="hp-bg"><div id="hp-fill"></div></div>
        </div>

        <div id="click-zone" onclick="train()"></div>

        <div id="story-box">
            <span id="story-txt">Goku: "I need to get stronger before I reach Namek!"</span>
        </div>
    </div>

<script>
    let power = 0;
    let level = 1;
    let friezaHP = 10000;
    let isMUI = false;

    const bg = document.getElementById('bg');
    const powerTxt = document.getElementById('power-txt');
    const lvlTxt = document.getElementById('lvl-txt');
    const storyTxt = document.getElementById('story-txt');
    const hpFill = document.getElementById('hp-fill');
    const bossUI = document.getElementById('boss-ui');
    const clickZone = document.getElementById('click-zone');

    function train() {
        if (level < 3) {
            // Leveling Logic
            power += 100;
            powerTxt.innerText = power;
            checkLevel();
        } else {
            // Boss Fight Logic
            fightBoss();
        }
        
        // Visual Feedback
        clickZone.style.boxShadow = isMUI ? "0 0 60px #fff" : "0 0 30px #0cf";
    }

    function checkLevel() {
        if (power >= 2000 && level === 1) {
            level = 2;
            lvlTxt.innerText = "2 (Namek)";
            bg.style.background = "#2e5a1e"; // Namek Sky
            storyTxt.innerText = "Frieza: 'A Saiyan? How boring. Allow me to show you true despair!'";
        } 
        else if (power >= 5000 && level === 2) {
            startBossFight();
        }
    }

    function startBossFight() {
        level = 3;
        lvlTxt.innerText = "BOSS FIGHT";
        bg.style.background = "#501"; // Exploding Namek
        bossUI.style.display = "block";
        storyTxt.innerText = "Goku: 'THIS ENDS NOW, FRIEZA! LIMIT BREAK!!'";
        
        // Trigger MUI Visuals
        isMUI = true;
        clickZone.classList.add('mui-glow');
    }

    function fightBoss() {
        // Damage depends on power/form
        let damage = isMUI ? 400 : 50;
        friezaHP -= damage;
        
        // Update Boss Health Bar
        let hpPercent = (friezaHP / 10000) * 100;
        hpFill.style.width = hpPercent + "%";

        if (friezaHP <= 5000) {
            storyTxt.innerText = "Frieza: 'IMPOSSIBLE! I AM THE EMPEROR OF THE UNIVERSE!'";
        }

        if (friezaHP <= 0) {
            winGame();
        }
    }

    function winGame() {
        hpFill.style.width = "0%";
        storyTxt.innerText = "VICTORY! Frieza has been defeated. You have reached the pinnacle of Saiyan power!";
        clickZone.style.display = "none";
        bg.style.background = "radial-gradient(circle, #0cf, #fff)";
        alert("GG! You finished the Namek Saga!");
    }
</script>
</body>
</html>
