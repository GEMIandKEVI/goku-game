<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAIYAN STANCE: BEYOND LIMIT</title>
    <style>
        :root { --goku-aura: #0cf; --frieza-aura: #a0f; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; }
        
        /* The Exploding Namek Stage */
        #stage { 
            width: 100vw; height: 100vh; 
            background: radial-gradient(circle at 50% 100%, #a21, #201, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Pro Fighter HUD */
        .hud-top { position: absolute; top: 30px; width: 90%; display: flex; justify-content: space-between; z-index: 10; }
        .hp-outer { width: 350px; height: 30px; background: #222; border: 3px solid #fff; transform: skew(-20deg); overflow: hidden; box-shadow: 0 0 15px rgba(255,255,255,0.3); }
        .hp-inner { height: 100%; width: 100%; transition: width 0.2s ease-out; }
        #g-hp { background: linear-gradient(90deg, #05f, #0cf); }
        #f-hp { background: linear-gradient(90deg, #70a, #f0f); }

        /* Combatants */
        .fighter { width: 140px; height: 200px; position: absolute; bottom: 30%; transition: transform 0.1s ease-out; }
        
        #goku { 
            left: 15%; background: linear-gradient(#fb0, #f60); border-radius: 10px;
            box-shadow: 0 0 50px var(--goku-aura); filter: drop-shadow(0 0 15px #fff);
        }
        #frieza { 
            right: 15%; background: linear-gradient(#eee, #999); border-radius: 10px;
            box-shadow: 0 0 50px var(--frieza-aura); border: 4px solid #a0f;
        }

        /* Buttons & VFX */
        .attack-btn { 
            position: absolute; bottom: 10%; padding: 25px 80px; font-size: 2.5rem; color: white;
            background: linear-gradient(#f00, #900); border: 5px solid #fff; cursor: pointer;
            border-radius: 15px; transform: skew(-10deg); text-shadow: 2px 2px #000;
            z-index: 20;
        }
        .attack-btn:active { transform: skew(-10deg) scale(0.95); }
