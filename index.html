<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GOKU VS FRIEZA</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; }
        #game { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #400; }
        
        /* Health Bars */
        .ui { position: absolute; top: 20px; width: 90%; display: flex; justify-content: space-between; }
        .bar-bg { width: 200px; height: 20px; background: #333; border: 2px solid white; }
        .bar-fill { height: 100%; width: 100%; transition: 0.2s; }
        
        /* Characters */
        #goku { position: absolute; left: 10%; bottom: 30%; width: 80px; height: 150px; background: orange; border: 4px solid cyan; box-shadow: 0 0 20px cyan; transition: 0.1s; }
        #frieza { position: absolute; right: 10%; bottom: 30%; width: 80px; height: 150px; background: white; border: 4px solid purple; box-shadow: 0 0 20px purple; transition: 0.1s; }
        
        /* Control */
        button { position: absolute; bottom: 50px; padding: 20px 60px; font-size: 2rem; background: red; color: white; border: none; cursor: pointer; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="game">
    <div class="ui">
        <div>GOKU HP<div class="bar-bg"><div id="g-hp" class="bar-fill" style="background: cyan;"></div></div></div>
        <div>FRIEZA HP<div class="bar-bg"><div id="f-hp" class="bar-fill" style="background: purple;"></div></div></div>
    </div>

    <div id="goku"></div>
    <div id="frieza"></div>

    <button onclick="attack()">STRIKE</button>
</div>

<script>
    let ghp = 100;
    let fhp = 100;

    function attack() {
        if(ghp <= 0 || fhp <= 0) return;

        // Goku Attack
        document.getElementById('goku').style.left = "60%";
        
        setTimeout(() => {
            fhp -= 10;
            document.getElementById('f-hp').style.width = fhp + "%";
            document.getElementById('goku').style.left = "10%";
            
            // Frieza Counter
            if(fhp > 0) {
                setTimeout(() => {
                    document.getElementById('frieza').style.right = "60%";
                    setTimeout(() => {
                        ghp -= 15;
                        document.getElementById('g-hp').style.width = ghp + "%";
                        document.getElementById('frieza').style.right = "10%";
                        if(ghp <= 0) alert("FRIEZA WINS! Refresh to try again.");
                    }, 100);
                }, 400);
            } else {
                alert("GOKU WINS!");
            }
        }, 100);
    }
</script>
</body>
</html>
